<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralAI Pro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #a1a1aa; }
        .glass { background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- CONFIG FIREBASE (Sesuai Gambar Kamu) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAPfaRXhA8FulUtOogR7roVRv_nAW8i4GM",
            authDomain: "sabena-digital-a0774.firebaseapp.com",
            projectId: "sabena-digital-a0774",
            storageBucket: "sabena-digital-a0774.firebasestorage.app",
            messagingSenderId: "311595817027",
            appId: "1:311595817027:web:5de50b20682ff0715bdcf6"
        };

        // Import Firebase dari CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "viral-ai-pro-v1";

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [image, setImage] = useState(null);
            const [jobs, setJobs] = useState([]);
            const [apiKey, setApiKey] = useState(localStorage.getItem('user_api_token') || "");
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                return onAuthStateChanged(auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        const userDocRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile');
                        onSnapshot(userDocRef, (docSnap) => {
                            if (docSnap.exists()) {
                                setUserData(docSnap.data());
                            } else {
                                setDoc(userDocRef, { email: currentUser.email, isApproved: false, createdAt: Date.now() });
                            }
                        });
                    }
                });
            }, []);

            useEffect(() => {
                if (!user || !userData?.isApproved) return;
                const q = collection(db, 'artifacts', APP_ID, 'public', 'data', 'jobs');
                return onSnapshot(q, (s) => {
                    const list = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setJobs(list.filter(j => j.userId === user.uid).sort((a,b) => b.createdAt - a.createdAt));
                });
            }, [user, userData]);

            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isLogin) await signInWithEmailAndPassword(auth, email, password);
                    else await createUserWithEmailAndPassword(auth, email, password);
                } catch (err) { alert(err.message); }
            };

            const createVideo = async () => {
                if (!apiKey) return alert("Isi API Token!");
                setLoading(true);
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'jobs'), {
                    userId: user.uid, image, status: 'queued', userToken: apiKey, createdAt: Date.now()
                });
                setImage(null);
                setLoading(false);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="w-full max-w-sm glass p-10 rounded-[2.5rem]">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/20">
                                    <i data-lucide="zap" className="w-8 h-8 text-white fill-current"></i>
                                </div>
                                <h2 className="text-2xl font-extrabold text-white italic tracking-tighter uppercase">ViralAI Pro</h2>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input type="email" placeholder="Email" required className="w-full bg-black border border-white/5 p-4 rounded-2xl text-sm text-white outline-none focus:border-indigo-500" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder="Password" required className="w-full bg-black border border-white/5 p-4 rounded-2xl text-sm text-white outline-none focus:border-indigo-500" value={password} onChange={e => setPassword(e.target.value)} />
                                <button className="w-full py-4 bg-white text-black font-extrabold rounded-2xl text-xs tracking-widest uppercase hover:bg-indigo-600 hover:text-white transition-all">
                                    {isLogin ? 'Log In' : 'Daftar Akun'}
                                </button>
                            </form>
                            <p className="text-center text-[10px] mt-8 text-zinc-600 font-bold cursor-pointer uppercase tracking-widest" onClick={() => setIsLogin(!isLogin)}>
                                {isLogin ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Login'}
                            </p>
                        </div>
                    </div>
                );
            }

            if (userData && !userData.isApproved) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center">
                        <div className="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center mb-6 border border-amber-500/20">
                            <i data-lucide="clock" className="w-10 h-10 text-amber-500 animate-pulse"></i>
                        </div>
                        <h2 className="text-xl font-bold text-white mb-2">Menunggu Izin Admin</h2>
                        <p className="text-zinc-500 text-sm mb-10 leading-relaxed max-w-xs">Akun Anda sedang diverifikasi. Silakan hubungi Admin untuk mengaktifkan akses masuk layanan AI Anda.</p>
                        <button onClick={() => signOut(auth)} className="text-indigo-500 text-xs font-bold underline">Logout & Cek Akun Lain</button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-10">
                    <div className="max-w-4xl mx-auto">
                        <header className="flex justify-between items-center mb-10">
                            <div className="flex items-center gap-3">
                                <div className="bg-green-500/20 p-2 rounded-xl text-green-500 border border-green-500/20"><i data-lucide="shield-check" className="w-5 h-5"></i></div>
                                <h1 className="text-white font-black italic tracking-tighter uppercase">VIRALAI.PRO</h1>
                            </div>
                            <button onClick={() => signOut(auth)} className="p-3 glass rounded-xl hover:text-red-500 transition-all"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                        </header>

                        <div className="glass p-8 rounded-[2.5rem] mb-10 shadow-2xl">
                            <div className="mb-8">
                                <label className="text-[10px] font-bold text-zinc-600 uppercase tracking-[0.2em] block mb-3 px-1">Replicate API Token</label>
                                <input type="password" value={apiKey} onChange={e => {setApiKey(e.target.value); localStorage.setItem('user_api_token', e.target.value);}} className="w-full bg-black border border-white/5 p-4 rounded-2xl text-[10px] text-white focus:border-indigo-500 outline-none" placeholder="r8_..." />
                            </div>

                            <label className="aspect-video bg-black border-2 border-dashed border-zinc-800 rounded-[2rem] flex flex-col items-center justify-center mb-8 overflow-hidden relative cursor-pointer active:scale-95 transition-transform">
                                {image ? <img src={image} className="absolute inset-0 w-full h-full object-cover" /> : <div className="text-center font-bold text-zinc-800 text-[10px] uppercase tracking-widest">Upload Photo Referensi</div>}
                                <input type="file" className="hidden" onChange={e => {
                                    const reader = new FileReader();
                                    reader.onload = (f) => setImage(f.target.result);
                                    reader.readAsDataURL(e.target.files[0]);
                                }} />
                            </label>

                            <button onClick={createVideo} disabled={loading || !image} className="w-full py-5 bg-white text-black font-black rounded-3xl shadow-xl hover:bg-indigo-600 hover:text-white transition-all text-xs tracking-widest">
                                {loading ? "MEMPROSES..." : "GENERATE VIDEO AI"}
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {jobs.map(j => (
                                <div key={j.id} className="glass p-5 rounded-[2rem] flex items-center gap-4">
                                    <div className="w-12 h-12 bg-black rounded-xl flex items-center justify-center shrink-0">
                                        {j.status === 'completed' ? <i data-lucide="play" className="w-5 h-5 text-indigo-500 fill-current"></i> : <i data-lucide="loader-2" className="w-4 h-4 animate-spin text-zinc-800"></i>}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <p className={`text-[8px] font-black uppercase tracking-widest mb-1 ${j.status === 'completed' ? 'text-green-500' : 'text-amber-500'}`}>{j.status}</p>
                                        <p className="text-[10px] text-zinc-600 truncate">{new Date(j.createdAt).toLocaleTimeString()}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {j.status === 'completed' && j.videoUrl && (
                                            <a href={j.videoUrl} target="_blank" className="p-2 glass rounded-lg text-indigo-400"><i data-lucide="download" className="w-4 h-4"></i></a>
                                        )}
                                        <button onClick={() => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'jobs', j.id))} className="p-2 text-zinc-800 hover:text-red-500"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Inisialisasi Ikon Lucide
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>

```
