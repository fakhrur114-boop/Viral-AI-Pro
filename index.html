<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>ViralAI Pro - Dashboard</title>
    <!-- Library -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; margin: 0; }
        .glass { background: rgba(12, 12, 12, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-main { background: white; color: black; font-weight: 800; transition: all 0.3s; }
        .btn-main:hover { background: #6366f1; color: white; transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5); }
        .loader { width: 35px; height: 35px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #000;">
            <div class="loader"></div>
        </div>
    </div>

    <!-- 
      PENTING: Menggunakan data-type="module" agar Babel tidak mengubah import menjadi require 
    -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;
        
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAPfaRXhA8FulUtOogR7roVRv_nAW8i4GM",
            authDomain: "sabena-digital-a0774.firebaseapp.com",
            projectId: "sabena-digital-a0774",
            storageBucket: "sabena-digital-a0774.firebasestorage.app",
            messagingSenderId: "311595817027",
            appId: "1:311595817027:web:5de50b20682ff0715bdcf6"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "viral-ai-pro-v1";

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [image, setImage] = useState(null);
            const [jobs, setJobs] = useState([]);
            const [apiKey, setApiKey] = useState(localStorage.getItem('user_api_token') || "");
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        const userDocRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile');
                        onSnapshot(userDocRef, (docSnap) => {
                            if (docSnap.exists()) {
                                setUserData(docSnap.data());
                            } else {
                                setDoc(userDocRef, { email: currentUser.email, isApproved: false, createdAt: Date.now() });
                            }
                        }, (err) => console.error("Profile Error:", err));
                    }
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user || !userData?.isApproved) return;
                const q = collection(db, 'artifacts', APP_ID, 'public', 'data', 'jobs');
                return onSnapshot(q, (s) => {
                    const list = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setJobs(list.filter(j => j.userId === user.uid).sort((a,b) => b.createdAt - a.createdAt));
                }, (err) => console.error("Jobs Error:", err));
            }, [user, userData]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (isLogin) await signInWithEmailAndPassword(auth, email, password);
                    else await createUserWithEmailAndPassword(auth, email, password);
                } catch (err) { 
                    console.error(err);
                    alert("Autentikasi Gagal: " + err.message); 
                }
                setLoading(false);
            };

            const createVideo = async () => {
                if (!apiKey) return alert("Sila isi API Token Replicate!");
                if (!image) return alert("Pilih foto!");
                setLoading(true);
                try {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'jobs'), {
                        userId: user.uid, 
                        image: image, 
                        status: 'queued', 
                        userToken: apiKey, 
                        createdAt: Date.now()
                    });
                    setImage(null);
                } catch(e) { 
                    console.error(e);
                    alert("Gagal membuat pesanan: " + e.message); 
                }
                setLoading(false);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-black">
                        <div className="w-full max-w-sm glass p-10 rounded-[3rem] shadow-2xl">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="zap" className="w-8 h-8 text-white fill-current"></i>
                                </div>
                                <h2 className="text-2xl font-black italic tracking-tighter uppercase">ViralAI Pro</h2>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input type="email" placeholder="Email" className="w-full bg-zinc-900 border border-white/5 p-4 rounded-2xl text-white outline-none focus:border-indigo-500" value={email} onChange={e => setEmail(e.target.value)} required />
                                <input type="password" placeholder="Password" className="w-full bg-zinc-900 border border-white/5 p-4 rounded-2xl text-white outline-none focus:border-indigo-500" value={password} onChange={e => setPassword(e.target.value)} required />
                                <button className="w-full py-4 btn-main rounded-2xl text-[10px] tracking-widest uppercase disabled:opacity-50" disabled={loading}>
                                    {loading ? 'Processing...' : (isLogin ? 'LOG IN' : 'DAFTAR')}
                                </button>
                            </form>
                            <p className="text-center text-[10px] mt-8 text-zinc-600 font-bold cursor-pointer uppercase tracking-widest" onClick={() => setIsLogin(!isLogin)}>
                                {isLogin ? 'Belum ada akun? Daftar' : 'Sudah punya akun? Login'}
                            </p>
                        </div>
                    </div>
                );
            }

            if (userData && !userData.isApproved) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-black">
                        <i data-lucide="clock" className="w-16 h-16 text-amber-500 mb-6 animate-pulse"></i>
                        <h2 className="text-xl font-bold text-white mb-2 uppercase italic tracking-tighter">Akses Tertunda</h2>
                        <p className="text-zinc-500 text-sm mb-10 max-w-xs leading-relaxed">Sila hubungi Admin Sabena Digital untuk mengaktifkan akses jualan anda.</p>
                        <button onClick={() => signOut(auth)} className="text-indigo-500 text-[10px] font-black uppercase tracking-widest underline">Keluar</button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-10 bg-black text-zinc-400">
                    <div className="max-w-4xl mx-auto">
                        <header className="flex justify-between items-center mb-10">
                            <h1 className="text-white font-black italic tracking-tighter uppercase text-xl">VIRALAI.PRO</h1>
                            <button onClick={() => signOut(auth)} className="p-3 glass rounded-xl hover:bg-red-500/10 transition-colors"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                        </header>

                        <div className="glass p-8 rounded-[2.5rem] mb-10 shadow-2xl">
                            <label className="text-[10px] font-bold text-zinc-600 uppercase tracking-widest block mb-4 px-1">Replicate API Token</label>
                            <input type="password" value={apiKey} onChange={e => {setApiKey(e.target.value); localStorage.setItem('user_api_token', e.target.value);}} className="w-full bg-black border border-white/5 p-4 rounded-2xl text-[10px] text-white focus:border-indigo-500 outline-none mb-8" placeholder="r8_..." />
                            
                            <label className="aspect-video bg-black border-2 border-dashed border-zinc-800 rounded-[2rem] flex items-center justify-center mb-8 cursor-pointer relative overflow-hidden group">
                                {image ? <img src={image} className="absolute inset-0 w-full h-full object-cover" /> : (
                                    <div className="text-center group-hover:scale-110 transition-transform">
                                        <i data-lucide="image" className="w-8 h-8 mx-auto text-zinc-800 mb-2"></i>
                                        <p className="text-[10px] font-bold text-zinc-800 uppercase tracking-widest">Upload Media</p>
                                    </div>
                                )}
                                <input type="file" className="hidden" onChange={e => {
                                    const reader = new FileReader();
                                    reader.onload = (f) => setImage(f.target.result);
                                    reader.readAsDataURL(e.target.files[0]);
                                }} />
                            </label>

                            <button onClick={createVideo} disabled={loading || !image} className="w-full py-5 btn-main rounded-3xl text-[10px] tracking-widest uppercase shadow-2xl active:scale-95 disabled:opacity-50">
                                {loading ? 'Memproses Video...' : 'BUAT VIDEO SEKARANG'}
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {jobs.map(j => (
                                <div key={j.id} className="glass p-5 rounded-[2rem] flex items-center gap-4 group">
                                    <div className="w-12 h-12 bg-black rounded-xl flex items-center justify-center shrink-0">
                                        {j.status === 'completed' ? <i data-lucide="play" className="text-indigo-500 fill-current"></i> : <i data-lucide="loader-2" className="animate-spin text-zinc-800"></i>}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <p className={`text-[8px] font-black uppercase tracking-widest mb-1 ${j.status === 'completed' ? 'text-green-500' : 'text-amber-500'}`}>{j.status}</p>
                                        <p className="text-[10px] text-zinc-700 truncate">{new Date(j.createdAt).toLocaleTimeString()}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {j.status === 'completed' && j.videoUrl && <a href={j.videoUrl} target="_blank" className="p-3 glass rounded-xl text-indigo-400 hover:bg-indigo-500 hover:text-white transition-all"><i data-lucide="download" className="w-4 h-4"></i></a>}
                                        <button onClick={() => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'jobs', j.id))} className="p-3 text-zinc-800 hover:text-red-500 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Memastikan ikon Lucide selalu ter-render ulang setiap kali React melakukan update DOM
        setInterval(() => { if(window.lucide) lucide.createIcons(); }, 1000);
    </script>
</body>
</html>
