<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralAI Pro - Solusi Video AI</title>
    <!-- Library Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-border { border: 1px solid rgba(99, 102, 241, 0.2); }
        .btn-prime { background: white; color: black; font-weight: 800; transition: all 0.3s; }
        .btn-prime:hover { background: #6366f1; color: white; transform: translateY(-2px); }
        .loading-ring { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <!-- Tampilan sebelum React dimuat -->
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000;">
            <div class="loading-ring"></div>
            <p style="margin-top: 20px; font-size: 10px; font-weight: 800; color: #444; letter-spacing: 4px; text-transform: uppercase;">Sistem Sedang Memuat</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- CONFIG FIREBASE SABENA DIGITAL ---
        const firebaseConfig = {
            apiKey: "AIzaSyAPfaRXhA8FulUtOogR7roVRv_nAW8i4GM",
            authDomain: "sabena-digital-a0774.firebaseapp.com",
            projectId: "sabena-digital-a0774",
            storageBucket: "sabena-digital-a0774.firebasestorage.app",
            messagingSenderId: "311595817027",
            appId: "1:311595817027:web:5de50b20682ff0715bdcf6"
        };

        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const APP_ID = "viral-ai-pro-v1";

            function App() {
                const [user, setUser] = useState(null);
                const [userData, setUserData] = useState(null);
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [isLogin, setIsLogin] = useState(true);
                const [image, setImage] = useState(null);
                const [jobs, setJobs] = useState([]);
                const [apiKey, setApiKey] = useState(localStorage.getItem('user_api_token') || "");
                const [loading, setLoading] = useState(false);

                useEffect(() => {
                    const unsub = onAuthStateChanged(auth, async (currentUser) => {
                        setUser(currentUser);
                        if (currentUser) {
                            const userDocRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile');
                            onSnapshot(userDocRef, (docSnap) => {
                                if (docSnap.exists()) {
                                    setUserData(docSnap.data());
                                } else {
                                    setDoc(userDocRef, { email: currentUser.email, isApproved: false, createdAt: Date.now() });
                                }
                            });
                        }
                    });
                    return () => unsub();
                }, []);

                useEffect(() => {
                    if (!user || !userData?.isApproved) return;
                    const q = collection(db, 'artifacts', APP_ID, 'public', 'data', 'jobs');
                    return onSnapshot(q, (s) => {
                        const list = s.docs.map(d => ({id: d.id, ...d.data()}));
                        setJobs(list.filter(j => j.userId === user.uid).sort((a,b) => b.createdAt - a.createdAt));
                    });
                }, [user, userData]);

                const handleAuth = async (e) => {
                    e.preventDefault();
                    setLoading(true);
                    try {
                        if (isLogin) await signInWithEmailAndPassword(auth, email, password);
                        else await createUserWithEmailAndPassword(auth, email, password);
                    } catch (err) { alert("Autentikasi Gagal: " + err.message); }
                    setLoading(false);
                };

                const createVideo = async () => {
                    if (!apiKey) return alert("Masukkan API Token!");
                    setLoading(true);
                    try {
                        await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'jobs'), {
                            userId: user.uid, image, status: 'queued', userToken: apiKey, createdAt: Date.now()
                        });
                        setImage(null);
                    } catch (e) { alert(e.message); }
                    setLoading(false);
                };

                if (!user) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-black">
                            <div className="w-full max-w-sm glass p-10 rounded-[3rem] shadow-2xl neon-border">
                                <div className="text-center mb-10">
                                    <div className="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/50">
                                        <i data-lucide="zap" className="w-8 h-8 text-white fill-current"></i>
                                    </div>
                                    <h2 className="text-3xl font-black text-white italic tracking-tighter uppercase">ViralAI <span className="text-indigo-500">Pro</span></h2>
                                    <p className="text-[9px] text-zinc-600 mt-2 font-bold uppercase tracking-[0.3em]">Premium AI Service</p>
                                </div>
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <input type="email" placeholder="Email" className="w-full bg-zinc-900/50 border border-white/5 p-4 rounded-2xl text-white outline-none focus:border-indigo-500" value={email} onChange={e => setEmail(e.target.value)} />
                                    <input type="password" placeholder="Password" className="w-full bg-zinc-900/50 border border-white/5 p-4 rounded-2xl text-white outline-none focus:border-indigo-500" value={password} onChange={e => setPassword(e.target.value)} />
                                    <button className="w-full py-4 btn-prime rounded-2xl text-[10px] tracking-widest uppercase">
                                        {loading ? "MEMPROSES..." : (isLogin ? 'LOG IN' : 'DAFTAR')}
                                    </button>
                                </form>
                                <p className="text-center text-[10px] mt-10 text-zinc-600 font-bold cursor-pointer hover:text-white uppercase tracking-widest" onClick={() => setIsLogin(!isLogin)}>
                                    {isLogin ? 'Belum Punya Akun? Daftar' : 'Sudah Punya Akun? Login'}
                                </p>
                            </div>
                        </div>
                    );
                }

                if (userData && !userData.isApproved) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-black">
                            <i data-lucide="clock" className="w-16 h-16 text-amber-500 mb-6 animate-pulse"></i>
                            <h2 className="text-xl font-bold text-white mb-2">Akses Ditangguhkan</h2>
                            <p className="text-zinc-500 text-sm mb-10 max-w-xs leading-relaxed">Sila hubungi Admin Sabena Digital untuk mengaktifkan akses jualan anda.</p>
                            <button onClick={() => signOut(auth)} className="text-indigo-500 text-[10px] font-black uppercase tracking-widest underline">Keluar</button>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen p-4 md:p-10 bg-[#020202]">
                        <div className="max-w-4xl mx-auto">
                            <header className="flex justify-between items-center mb-12">
                                <h1 className="text-white font-black italic tracking-tighter uppercase text-xl">VIRALAI.PRO</h1>
                                <button onClick={() => signOut(auth)} className="p-4 glass rounded-2xl hover:bg-red-500/10 transition-colors"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                            </header>

                            <div className="glass p-8 rounded-[2.5rem] mb-12 shadow-2xl neon-border">
                                <label className="text-[10px] font-bold text-zinc-700 uppercase tracking-[0.3em] block mb-4 px-1">Replicate API Token</label>
                                <input type="password" value={apiKey} onChange={e => {setApiKey(e.target.value); localStorage.setItem('user_api_token', e.target.value);}} className="w-full bg-black border border-white/5 p-4 rounded-2xl text-[10px] text-white focus:border-indigo-500 outline-none" placeholder="r8_..." />
                                
                                <label className="mt-10 aspect-video bg-black border-2 border-dashed border-zinc-900 rounded-[2rem] flex items-center justify-center mb-10 cursor-pointer overflow-hidden relative group">
                                    {image ? <img src={image} className="absolute inset-0 w-full h-full object-cover" /> : (
                                        <div className="text-center group-hover:scale-110 transition-transform">
                                            <i data-lucide="image" className="w-8 h-8 mx-auto text-zinc-800 mb-3"></i>
                                            <p className="text-[10px] font-bold text-zinc-800 uppercase tracking-widest">Klik Upload Media</p>
                                        </div>
                                    )}
                                    <input type="file" className="hidden" onChange={e => {
                                        const reader = new FileReader();
                                        reader.onload = (f) => setImage(f.target.result);
                                        reader.readAsDataURL(e.target.files[0]);
                                    }} />
                                </label>

                                <button onClick={createVideo} disabled={loading || !image} className="w-full py-5 btn-prime rounded-3xl text-[10px] tracking-widest uppercase shadow-2xl active:scale-95">
                                    {loading ? "PROSES GENERATE..." : "BUAT VIDEO AI SEKARANG"}
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {jobs.map(j => (
                                    <div key={j.id} className="glass p-6 rounded-[2rem] flex items-center gap-5 transition-all hover:bg-white/5">
                                        <div className="w-14 h-14 bg-black rounded-2xl flex items-center justify-center shrink-0 border border-white/5">
                                            {j.status === 'completed' ? <i data-lucide="play" className="text-indigo-500 fill-current"></i> : <i data-lucide="loader-2" className="animate-spin text-zinc-800"></i>}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <p className={`text-[9px] font-black uppercase tracking-widest mb-1 ${j.status === 'completed' ? 'text-green-500' : 'text-amber-500'}`}>{j.status}</p>
                                            <p className="text-[10px] text-zinc-700 font-medium">{new Date(j.createdAt).toLocaleTimeString()}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            {j.status === 'completed' && j.videoUrl && <a href={j.videoUrl} target="_blank" className="p-3 glass rounded-xl text-indigo-400 hover:bg-indigo-500 hover:text-white transition-all"><i data-lucide="download" className="w-4 h-4"></i></a>}
                                            <button onClick={() => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'jobs', j.id))} className="p-3 text-zinc-800 hover:text-red-500 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            setInterval(() => { if(window.lucide) lucide.createIcons(); }, 1000);
        } catch (e) {
            document.body.innerHTML = `<div style="padding:40px; color:red; font-family:sans-serif;">
                <b>KRITIS ERROR:</b> <br>${e.message}<br><br>
                Saran: Matikan Google Translate di browser anda dan Refresh.
            </div>`;
        }
    </script>
</body>
</html>

```
